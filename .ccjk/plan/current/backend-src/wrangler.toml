name = "ccjk-provider-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# 开发环境变量
[vars]
ENVIRONMENT = "development"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "ccjk-providers"
database_id = "YOUR_DATABASE_ID_HERE"  # 运行 wrangler d1 create 后替换

# 生产环境配置
[env.production]
vars = { ENVIRONMENT = "production" }

# 自定义域名路由 (可选)
# routes = [
#   { pattern = "api.claudehome.cn/*", zone_name = "claudehome.cn" }
# ]
