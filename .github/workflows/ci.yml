name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }} · Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # Smoke test：Linux/macOS 走 bash 默认，Windows 显式 bash（GitHub runner 自带）
      - name: Smoke test built CLI (POSIX)
        if: runner.os != 'Windows'
        run: |
          node dist/cli.mjs --version
          node dist/cli.mjs --help
          node dist/cli.mjs proxy --help
          node dist/cli.mjs provider --help

      - name: Smoke test built CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node dist/cli.mjs --version
          node dist/cli.mjs --help
          node dist/cli.mjs proxy --help
          node dist/cli.mjs provider --help
